[Unit]
After=network-online.target docker.service
Wants=network-online.target

[Service]
User=server
Group=server
WorkingDirectory=/data/services/mediagent
Environment=MEDIAGENT_PROJECT=/data/services/mediagent
Environment=MEDIAGENT_DB_PATH=/data/services/mediagent/data/mediagent.sqlite3
Environment=MEDIAGENT_LIBRARY_ROOT=/data/nas/mediagent
Environment=MEDIAGENT_LIBRARY_DIR=/data/nas/mediagent
ExecStart=
ExecStart=/usr/bin/flock --nonblock --conflict-exit-code 75 /run/lock/mediagent-sync.lock /data/services/immich-private/scripts/cleanup_delete_candidates.py --execute
SuccessExitStatus=75
UMask=0027
